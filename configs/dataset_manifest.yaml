project: more-omics-is-not-always-better
manifest_status: locked_initial_set
as_of: 2026-08-21

response_resources:
  - id: gdsc1
    name: Genomics of Drug Sensitivity in Cancer 1
    role: primary_or_external
    response_metric: AUC
    source_url: https://www.cancerrxgene.org/downloads/bulk_download
    release: Harmonized GDSC 25Q2
  - id: gdsc2
    name: Genomics of Drug Sensitivity in Cancer 2
    role: primary_or_external
    response_metric: AUC
    source_url: https://www.cancerrxgene.org/downloads/bulk_download
    release: Harmonized GDSC 25Q2
  - id: ccle_depmap
    name: Cancer Cell Line Encyclopedia / DepMap
    role: primary_or_external
    response_metric: molecular_features_only
    source_url: https://depmap.org/portal/download/all/
    release: DepMap Public 26Q1
  - id: ctrpv2
    name: Cancer Therapeutics Response Portal version 2
    role: external_validation_candidate
    response_metric: AUC
    source_url: https://depmap.org/portal/download/all/
    release: Harmonized CTD^2 25Q2

modalities:
  transcriptomics:
    required: true
    preprocessing: lock_after_release_audit
  mutation:
    required: true
    representation: binary_gene_level_initially
  copy_number:
    required: true
    representation: gene_level_continuous_or_discretized_after_audit

harmonization:
  cell_lines: Cellosaurus_accession_preferred
  compounds: PubChem_CID_preferred
  genes: stable_gene_identifier_with_version_recorded
  response_metric: no_mixing_without_pre_specified_sensitivity_analysis

validation:
  splits: [pair_held_out, cell_line_held_out, drug_held_out, cross_study]
  seeds: to_lock
  minimum_stratum_size: to_lock
